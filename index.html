© 2026 Florian Peelman · <a href="mailto:florianpeelman@gmail.com">Contact</a>
</footer>

<script>
fetch("events.json")
.then(res => res.json())
.then(data => {
  const container = document.getElementById("events-home");

  data.slice(0,2).forEach(ev => {
    container.innerHTML += `
      <div class="event">
        <div>
          <strong>${ev.date}</strong><br>
          ${ev.place}
        </div>
      </div>
    `;
  });
});
</script>
