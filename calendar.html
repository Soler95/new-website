<script>
fetch("events.json")
.then(res => res.json())
.then(data => {
  const container = document.getElementById("events-full");

  data.forEach(ev => {
    container.innerHTML += `
      <div class="event">
        <div>
          <strong>${ev.date}</strong><br>
          ${ev.place}
        </div>
        <a class="ticket" href="${ev.ticket}" target="_blank">Tickets</a>
      </div>
    `;
  });
});
</script>

  <script>
    /* ── CURSOR ── */
    const cur  = document.getElementById('cur');
    const ring = document.getElementById('cur-ring');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;
 
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cur.style.left = mx + 'px';
      cur.style.top  = my + 'px';
    });
    document.addEventListener('mousedown', () => document.body.classList.add('clicking'));
    document.addEventListener('mouseup',   () => document.body.classList.remove('clicking'));
 
    document.querySelectorAll('a, button, .ticket, .btn, .logo, .social a, .menu a, .footer-nav a').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovered'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovered'));
    });
 
    (function tick() {
      rx += (mx - rx) * .11;
      ry += (my - ry) * .11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(tick);
    })();
 
    /* ── SCROLL: header + progress ── */
    const hdr  = document.getElementById('hdr');
    const prog = document.getElementById('prog');
 
    window.addEventListener('scroll', () => {
      const s   = window.scrollY;
      const max = document.body.scrollHeight - window.innerHeight;
      hdr.classList.toggle('stuck', s > 60);
      prog.style.width = (max > 0 ? (s / max * 100) : 0) + '%';
    }, { passive: true });
 
    /* ── HERO ENTRANCE ── */
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.getElementById('hbg').classList.add('in'),    100);
      setTimeout(() => document.getElementById('htag').classList.add('in'),   300);
      setTimeout(() => document.getElementById('htitle').classList.add('in'), 480);
      setTimeout(() => document.getElementById('hsub').classList.add('in'),   660);
      setTimeout(() => document.getElementById('hbtns').classList.add('in'),  820);
    });
 
    /* ── SCROLL REVEAL ── */
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: .1 });
